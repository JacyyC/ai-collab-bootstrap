name: Validate Skill
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 scripts/validate_repo.py
      - run: python3 -B -m unittest discover -s template-source/workspace/scripts/tests -v
      - run: python3 -B -m unittest discover -s scripts/tests -v
